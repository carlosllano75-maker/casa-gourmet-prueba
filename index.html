<!DOCTYPE html> 
<html lang="es"> 
<head> 
  <meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"> 
  <title>Control de Inventario y Recetas</title>
  <meta name="theme-color" content="#2c3e50">
  
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <style> 
    :root { --primary: #2c3e50; --accent: #e67e22; --success: #27ae60; --bg: #f4f7f6; --blue: #3498db; --warning: #f39c12; --danger: #e74c3c; }
    body{font-family:'Segoe UI',Arial,sans-serif; background:var(--bg); color:#333; margin:0; padding-bottom:60px;} 
    header{background: linear-gradient(135deg, var(--primary) 0%, #000 100%); padding:15px; text-align:center; color:white; border-bottom:4px solid var(--accent); position: sticky; top:0; z-index:1000;} 
    .menu-superior{display:grid; grid-template-columns: repeat(3, 1fr); gap:5px; background:#ecf0f1; padding:10px;}
    .grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:10px; padding:10px} 
    .card{background:white; border-radius:10px; padding:15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #eee; position:relative;} 
    .stock-bajo { border: 2px solid var(--danger) !important; background: #fff5f5; }
    button{padding:10px; border:none; border-radius:8px; background:var(--accent); color:white; font-weight:bold; cursor:pointer;} 
    .btn-accion{background:var(--success); width:100%; margin-top:10px;}
    .lista{background:white; padding:15px; border-radius:12px; margin:10px; border:1px solid #ddd;} 
    .item-receta{display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #eee; padding:8px 0;}
    input, select{padding:12px; border-radius:8px; border:1px solid #ccc; width:92%; margin:8px auto; display:block; font-size:16px; box-sizing:border-box; width: 100%;}
    .badge{background:var(--primary); color:white; padding:3px 8px; border-radius:5px; font-size:0.8em; font-weight:bold;}
    
    .form-group { margin-bottom: 15px; }
    .form-group label { font-weight: bold; font-size: 0.9em; color: #555; margin-left: 5px; }
    
    #bloqueo { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--primary); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    #sync-status { position: fixed; bottom: 10px; right: 10px; font-size: 10px; color: #777; z-index: 3000; }
  </style> 
</head> 
<body> 

  <div id="sync-status">Nube: Conectado</div>
  
  <div id="bloqueo">
    <h2 style="color:white">SISTEMA DE INVENTARIO</h2>
    <input type="password" id="passInput" placeholder="Clave de acceso (CARLOS2026)" style="text-align:center; width: 80%;"><br>
    <button onclick="validarLicencia()" style="background:var(--success); padding: 15px 30px;">Ingresar</button>
  </div>

  <div id="contenido-app" style="display:none">
    <header><b>📦 CONTROL DE INVENTARIO Y RECETAS</b></header> 
    <div class="menu-superior">
      <button onclick="verIngredientes()">🍅 Ingredientes</button>
      <button onclick="verRecetas()">🍔 Recetas</button>
      <button onclick="verDescarga()" style="background:var(--success);">📉 Descontar Consumo</button>
      <button onclick="verHistorial()" style="background:#7f8c8d; grid-column: span 3;">📊 Historial de Movimientos</button>
    </div>
    <div id="app" style="padding: 10px;"></div> 
  </div>

  <script> 
    // --- CONFIGURACIÓN DE FIREBASE ---
    const firebaseConfig = {
      apiKey: "AIzaSyBe4KD0YDZj2XCIhhqcT1bp30xbtRHOszk",
      authDomain: "bodeguita-pro.firebaseapp.com",
      projectId: "bodeguita-pro",
      storageBucket: "bodeguita-pro.firebasestorage.app",
      messagingSenderId: "904643526992",
      appId: "1:904643526992:web:93b57a49a3841194ceec55"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const CLAVE_MAESTRA = "CARLOS2026";

    // Variables globales
    let ingredientes = [];
    let recetas = [];
    let historial = [];
    
    // Variables temporales para creación de recetas
    let recetaTemporal = { nombre: "", items: [] };
    let editandoRecetaIdx = -1;

    // --- SINCRONIZACIÓN NUBE ---
    function cargarDatosDesdeNube() {
      document.getElementById('sync-status').innerText = "Nube: Cargando...";
      db.ref('inventario_restaurante_v2').once('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
          ingredientes = data.ingredientes || [];
          recetas = data.recetas || [];
          historial = data.historial || [];
        }
        document.getElementById('sync-status').innerText = "Nube: Sincronizado";
        verIngredientes(); 
      });
    }

    function guardar() {
      document.getElementById('sync-status').innerText = "Nube: Guardando...";
      db.ref('inventario_restaurante_v2').set({
        ingredientes, recetas, historial
      }).then(() => {
        document.getElementById('sync-status').innerText = "Nube: Sincronizado";
      });
    }

    function validarLicencia() {
      if(document.getElementById("passInput").value === CLAVE_MAESTRA) {
        document.getElementById("bloqueo").style.display = "none";
        document.getElementById("contenido-app").style.display = "block";
        cargarDatosDesdeNube();
      } else alert("Clave incorrecta");
    }

    // ================= MÓDULO: INGREDIENTES =================
    function verIngredientes() {
      let html = `<h3>🍅 Ingredientes (Materia Prima)</h3>
                  <button onclick='abrirFormIngrediente()' class='btn-accion'>+ Nuevo Ingrediente</button>
                  <div class='grid' style='margin-top:15px;'>`;
      
      ingredientes.forEach((ing, i) => {
        let esBajo = ing.stock <= ing.minimo;
        html += `<div class='card ${esBajo ? 'stock-bajo' : ''}'>
                  ${esBajo ? '<div style="color:red;font-size:11px;font-weight:bold;">⚠️ STOCK BAJO</div>' : ''}
                  <b style="font-size:1.1em">${ing.nombre}</b><br>
                  <span class='badge'>${ing.stock} ${ing.unidad}</span><br>
                  <small>Min: ${ing.minimo} ${ing.unidad}</small><br>
                  <div style="margin-top:10px; display:flex; gap:5px;">
                    <button onclick='abrirFormIngrediente(${i})' style='background:var(--blue); flex:1'>✏️ Editar</button>
                    <button onclick='if(confirm("¿Eliminar ingrediente?")){ingredientes.splice(${i},1);guardar();verIngredientes()}' style='background:var(--danger); flex:1'>🗑️</button>
                  </div>
                 </div>`;
      });
      document.getElementById("app").innerHTML = html + "</div>";
    }

    function abrirFormIngrediente(idx = -1) {
      let ing = idx !== -1 ? ingredientes[idx] : {nombre:"", unidad:"gr", stock:0, minimo:0};
      document.getElementById("app").innerHTML = `
        <div class="lista">
          <h3>${idx!==-1?'Editar':'Nuevo'} Ingrediente</h3>
          <div class="form-group"><label>Nombre del Ingrediente</label>
            <input id='i-nombre' placeholder='Ej. Carne Molida, Pan Hamburguesa' value='${ing.nombre}'></div>
          <div class="form-group"><label>Unidad de Medida</label>
            <select id='i-unidad'>
              <option value="gr" ${ing.unidad==='gr'?'selected':''}>Gramos (gr)</option>
              <option value="ml" ${ing.unidad==='ml'?'selected':''}>Mililitros (ml)</option>
              <option value="und" ${ing.unidad==='und'?'selected':''}>Unidades (und)</option>
            </select></div>
          <div class="form-group"><label>Stock Actual</label>
            <input id='i-stock' type='number' step='any' placeholder='Cantidad en inventario' value='${ing.stock}'></div>
          <div class="form-group"><label>Alerta de Stock Mínimo</label>
            <input id='i-minimo' type='number' step='any' placeholder='Avisar cuando llegue a...' value='${ing.minimo}'></div>
          <button onclick='guardarIngrediente(${idx})' class='btn-accion'>💾 Guardar Ingrediente</button>
          <button onclick='verIngredientes()' style='width:100%; margin-top:10px; background:#95a5a6'>Cancelar</button>
        </div>`;
    }

    function guardarIngrediente(idx) {
      let obj = {
        nombre: document.getElementById('i-nombre').value,
        unidad: document.getElementById('i-unidad').value,
        stock: parseFloat(document.getElementById('i-stock').value) || 0,
        minimo: parseFloat(document.getElementById('i-minimo').value) || 0
      };
      if(!obj.nombre) return alert("El nombre es obligatorio");
      
      if(idx === -1) ingredientes.push(obj);
      else ingredientes[idx] = obj;
      
      guardar(); verIngredientes();
    }

    // ================= MÓDULO: RECETAS =================
    function verRecetas() {
      let html = `<h3>🍔 Recetas / Platillos</h3>
                  <button onclick='prepararNuevaReceta()' class='btn-accion'>+ Crear Nueva Receta</button>
                  <div class='grid' style='margin-top:15px;'>`;
      
      recetas.forEach((receta, i) => {
        html += `<div class='card'>
                  <b style="font-size:1.2em">${receta.nombre}</b><br>
                  <small>${receta.items.length} ingredientes configurados</small><br>
                  <div style="margin-top:10px; display:flex; gap:5px;">
                    <button onclick='editarReceta(${i})' style='background:var(--blue); flex:1'>✏️ Configurar</button>
                    <button onclick='if(confirm("¿Eliminar receta?")){recetas.splice(${i},1);guardar();verRecetas()}' style='background:var(--danger); flex:1'>🗑️</button>
                  </div>
                 </div>`;
      });
      document.getElementById("app").innerHTML = html + "</div>";
    }

    function prepararNuevaReceta() {
      recetaTemporal = { nombre: "", items: [] };
      editandoRecetaIdx = -1;
      renderFormularioReceta();
    }

    function editarReceta(idx) {
      recetaTemporal = JSON.parse(JSON.stringify(recetas[idx])); // Copia profunda
      editandoRecetaIdx = idx;
      renderFormularioReceta();
    }

    function renderFormularioReceta() {
      if(ingredientes.length === 0) {
        alert("Primero debes crear ingredientes en el inventario.");
        return verIngredientes();
      }

      let htmlItems = "";
      recetaTemporal.items.forEach((item, indexItem) => {
        let ingData = ingredientes.find(i => i.nombre === item.nombreIngrediente);
        let unidad = ingData ? ingData.unidad : "?";
        htmlItems += `<div class='item-receta'>
                        <div><b>${item.nombreIngrediente}</b> <br><small>Resta: ${item.cantidad} ${unidad}</small></div>
                        <button onclick='quitarIngredienteReceta(${indexItem})' style='background:red; padding:5px 10px;'>X</button>
                      </div>`;
      });

      let opcionesIngredientes = ingredientes.map(ing => `<option value="${ing.nombre}">${ing.nombre} (${ing.unidad})</option>`).join("");

      document.getElementById("app").innerHTML = `
        <div class="lista">
          <h3>${editandoRecetaIdx !== -1 ? 'Editar' : 'Nueva'} Receta</h3>
          <div class="form-group">
            <label>Nombre del Platillo</label>
            <input id='r-nombre' placeholder='Ej. Hamburguesa Doble' value='${recetaTemporal.nombre}' oninput='recetaTemporal.nombre = this.value'>
          </div>
          <hr>
          <h4>Fórmula / Ingredientes</h4>
          ${htmlItems || "<p style='color:#777; font-size:14px;'>No hay ingredientes añadidos. Usa el panel de abajo.</p>"}
          
          <div style="background:#f9f9f9; padding:10px; border-radius:8px; margin-top:15px; border:1px solid #ddd;">
            <select id='r-ing-select'>${opcionesIngredientes}</select>
            <input id='r-ing-cant' type='number' step='any' placeholder='Cantidad a descontar'>
            <button onclick='agregarIngredienteReceta()' style='width:100%; background:var(--primary); margin-top:5px;'>+ Añadir a la receta</button>
          </div>
          
          <button onclick='guardarRecetaFinal()' class='btn-accion' style='margin-top:20px; font-size:1.1em; padding:15px;'>💾 GUARDAR RECETA</button>
          <button onclick='verRecetas()' style='width:100%; margin-top:10px; background:#95a5a6'>Cancelar</button>
        </div>`;
    }

    function agregarIngredienteReceta() {
      let nombreIng = document.getElementById('r-ing-select').value;
      let cantidad = parseFloat(document.getElementById('r-ing-cant').value);
      
      if(!cantidad || cantidad <= 0) return alert("Ingresa una cantidad válida.");
      
      // Evitar duplicados
      let existe = recetaTemporal.items.findIndex(i => i.nombreIngrediente === nombreIng);
      if(existe !== -1) {
        recetaTemporal.items[existe].cantidad += cantidad;
      } else {
        recetaTemporal.items.push({ nombreIngrediente: nombreIng, cantidad: cantidad });
      }
      renderFormularioReceta();
    }

    function quitarIngredienteReceta(indexItem) {
      recetaTemporal.items.splice(indexItem, 1);
      renderFormularioReceta();
    }

    function guardarRecetaFinal() {
      if(!recetaTemporal.nombre) return alert("La receta debe tener un nombre.");
      if(recetaTemporal.items.length === 0) return alert("Añade al menos un ingrediente a la receta.");

      if(editandoRecetaIdx === -1) recetas.push(recetaTemporal);
      else recetas[editandoRecetaIdx] = recetaTemporal;

      guardar(); verRecetas();
    }

    // ================= MÓDULO: DESCARGA DE INVENTARIO =================
    function verDescarga() {
      if(recetas.length === 0) {
        document.getElementById("app").innerHTML = `<div class="lista"><h3>No hay recetas</h3><p>Crea recetas primero para poder registrar consumos.</p></div>`;
        return;
      }

      let opcionesRecetas = recetas.map((r, i) => `<option value="${i}">${r.nombre}</option>`).join("");

      document.getElementById("app").innerHTML = `
        <div class="lista">
          <h3>📉 Registrar Consumo / Venta</h3>
          <p style="font-size:14px; color:#555;">Selecciona el platillo vendido y la cantidad. El sistema descontará automáticamente los ingredientes configurados.</p>
          
          <div class="form-group">
            <label>Platillo Vendido</label>
            <select id='d-receta'>${opcionesRecetas}</select>
          </div>
          
          <div class="form-group">
            <label>Cantidad (Porciones/Platos)</label>
            <input id='d-cant' type='number' value='1' min='1'>
          </div>

          <div class="form-group">
            <label>Nota (Opcional)</label>
            <input id='d-nota' type='text' placeholder='Ej. Mesa 4, Pedido #12'>
          </div>

          <button onclick='ejecutarDescarga()' style='background:var(--success); width:100%; padding:15px; font-size:1.1em;'>⚡ DESCONTAR DEL INVENTARIO</button>
        </div>`;
    }

    function ejecutarDescarga() {
      let idxReceta = document.getElementById('d-receta').value;
      let cantidadPlatos = parseInt(document.getElementById('d-cant').value);
      let nota = document.getElementById('d-nota').value || "Venta general";
      
      if(!cantidadPlatos || cantidadPlatos <= 0) return alert("Cantidad inválida");

      let receta = recetas[idxReceta];
      let desgloseDescuentos = [];

      // Validar y ejecutar descuentos
      receta.items.forEach(item => {
        let ingIdx = ingredientes.findIndex(i => i.nombre === item.nombreIngrediente);
        if(ingIdx !== -1) {
          let cantDescontar = item.cantidad * cantidadPlatos;
          ingredientes[ingIdx].stock -= cantDescontar;
          desgloseDescuentos.push(`${cantDescontar} ${ingredientes[ingIdx].unidad} de ${item.nombreIngrediente}`);
        }
      });

      // Guardar historial
      historial.unshift({
        fecha: new Date().toLocaleString(),
        accion: `Se prepararon ${cantidadPlatos}x ${receta.nombre}`,
        nota: nota,
        detalles: desgloseDescuentos.join(", ")
      });

      // Mantener historial a los últimos 100 registros para no saturar memoria
      if(historial.length > 100) historial.pop();

      guardar();
      alert(`✅ Inventario descontado con éxito para ${cantidadPlatos}x ${receta.nombre}.`);
      verDescarga();
    }

    // ================= MÓDULO: HISTORIAL =================
    function verHistorial() {
      let html = `<h3>📊 Últimos Movimientos</h3>`;
      if(historial.length === 0) html += "<p>No hay movimientos registrados.</p>";
      
      historial.forEach(h => {
        html += `<div class='lista' style='padding:10px; margin-bottom:10px;'>
                  <div style="font-size:12px; color:#888;">${h.fecha}</div>
                  <b>${h.accion}</b><br>
                  <small style="color:var(--blue)">📝 ${h.nota}</small><br>
                  <div style="font-size:12px; margin-top:5px; background:#f9f9f9; padding:5px; border-radius:5px;">
                    <i>Descontado:</i> ${h.detalles}
                  </div>
                 </div>`;
      });
      document.getElementById("app").innerHTML = html;
    }
  </script> 
</body> 
</html>
